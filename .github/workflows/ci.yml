name: Verify Agent Sentry
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -v
      - run: python -m agent_sentry eval --output replay-results.json
      - run: python -m examples.guarded_agent
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Verify installed package assets outside source directory
        working-directory: ${{ runner.temp }}
        run: python -c "from importlib.resources import files; from agent_sentry import __version__; assert files('agent_sentry.web').joinpath('dashboard.html').is_file(); print(__version__)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-${{ matrix.os }}-${{ matrix.python }}
          path: replay-results.json
